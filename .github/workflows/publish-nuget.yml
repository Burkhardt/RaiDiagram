name: Publish RaiDiagram

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate tag matches csproj version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CSPROJ_VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" RaiDiagram.csproj)
          echo "Tag version: ${TAG_VERSION}"
          echo "Project version: ${CSPROJ_VERSION}"
          if [[ "${TAG_VERSION}" != "${CSPROJ_VERSION}" ]]; then
            echo "Tag version does not match RaiDiagram.csproj <Version>."
            exit 1
          fi

      - name: Restore
        run: dotnet restore RaiDiagram.slnx /p:UseLocalRAIkeepSources=false

      - name: Build
        run: dotnet build RaiDiagram.slnx --configuration Release --no-restore /p:UseLocalRAIkeepSources=false

      - name: Test
        run: dotnet test RaiDiagram.Tests/RaiDiagram.Tests.csproj --configuration Release --no-build --no-restore /p:UseLocalRAIkeepSources=false

      - name: Pack
        run: dotnet pack RaiDiagram.csproj --configuration Release --no-build --output artifacts /p:UseLocalRAIkeepSources=false

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: Burkhardt

      - name: Publish to NuGet
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
