name: Publish RaiDiagram

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java for PlantUML
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned PlantUML CLI
        shell: bash
        run: |
          PLANTUML_VERSION="1.2026.6"
          PLANTUML_JAR="${RUNNER_TEMP}/plantuml-${PLANTUML_VERSION}.jar"
          curl --fail --location --silent --show-error \
            --output "${PLANTUML_JAR}" \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"
          echo "89948f14c93756c7a3fb7b69078ff37e8489fd79dd430c582b931e2f65358690  ${PLANTUML_JAR}" | sha256sum --check
          java -Djava.awt.headless=true -jar "${PLANTUML_JAR}" -version
          echo "RAIDIAGRAM_PLANTUML_JAR=${PLANTUML_JAR}" >> "${GITHUB_ENV}"
          echo "JAVA_TOOL_OPTIONS=-Djava.awt.headless=true" >> "${GITHUB_ENV}"

      - name: Validate tag matches csproj version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CSPROJ_VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" RaiDiagram.csproj)
          echo "Tag version: ${TAG_VERSION}"
          echo "Project version: ${CSPROJ_VERSION}"
          if [[ "${TAG_VERSION}" != "${CSPROJ_VERSION}" ]]; then
            echo "Tag version does not match RaiDiagram.csproj <Version>."
            exit 1
          fi

      - name: Restore
        run: dotnet restore RaiDiagram.slnx /p:UseLocalRAIkeepSources=false

      - name: Build
        run: dotnet build RaiDiagram.slnx --configuration Release --no-restore /p:UseLocalRAIkeepSources=false

      - name: Test
        run: dotnet test RaiDiagram.Tests/RaiDiagram.Tests.csproj --configuration Release --no-build --no-restore /p:UseLocalRAIkeepSources=false

      - name: Pack
        run: dotnet pack RaiDiagram.csproj --configuration Release --no-build --output artifacts /p:UseLocalRAIkeepSources=false

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: Burkhardt

      - name: Publish to NuGet
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
